<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#14111c">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="BEPCAL">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>BEPCAL</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@600;800&family=Figtree:wght@400;500;600;700&display=swap">
<style>
/* reset die de Claude-omgeving vroeger gaf */
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0;font:14px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif}
img{max-width:100%}
[hidden]{display:none!important}

/* Layout: one column for the phone at the door; owner dashboard flows to two columns on wide screens. Dark-first (club light). */
:root{
  --bg:#14111c; --surface:#1c1826; --surface-2:#262133; --line:#362f47;
  --fg:#f3eff9; --muted:#a69dbd; --accent:#ffb547; --accent-ink:#1b1206;
  --cash:#25a874; --card:#5b8cff; --free:#b38c35; --tip:#d07ad6;
  --good:#3ecf8e; --warn:#f2b63c; --bad:#ff5f6d;
  --display:"Unbounded","Arial Black",system-ui,sans-serif;
  --body:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
  --r:14px;
  color-scheme:dark;
}
@media (prefers-color-scheme: light){:root:not([data-theme="dark"]){
  --bg:#f5f2f9; --surface:#ffffff; --surface-2:#eee9f5; --line:#dcd4e8;
  --fg:#1b1625; --muted:#665c7c; --accent:#b8650a; --accent-ink:#ffffff;
  --cash:#13915a; --card:#2f62d6; --free:#a77a12; --tip:#a640ad;
  --good:#13915a; --warn:#a96d00; --bad:#cf2b3c; color-scheme:light}}
:root[data-theme="light"]{
  --bg:#f5f2f9; --surface:#ffffff; --surface-2:#eee9f5; --line:#dcd4e8;
  --fg:#1b1625; --muted:#665c7c; --accent:#b8650a; --accent-ink:#ffffff;
  --cash:#13915a; --card:#2f62d6; --free:#a77a12; --tip:#a640ad;
  --good:#13915a; --warn:#a96d00; --bad:#cf2b3c; color-scheme:light}
html,body{min-height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.45;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px 40px}
*{box-sizing:border-box}
h1,h2,h3{font-family:var(--display);margin:0;text-wrap:balance;letter-spacing:.01em}
h2{font-size:13px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600}
.num{font-variant-numeric:tabular-nums}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:1100px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
.bar{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.brand{font-family:var(--display);font-weight:800;font-size:20px;letter-spacing:.04em}
.brand small{display:block;font-family:var(--body);font-size:11px;font-weight:600;letter-spacing:.12em;color:var(--muted);text-transform:uppercase}
.spacer{flex:1}
.btn{border:1px solid var(--line);background:var(--surface-2);border-radius:999px;padding:8px 14px;font-weight:600;font-size:14px}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:transparent}
.btn.danger{border-color:var(--bad);color:var(--bad);background:transparent}
.btn:disabled{opacity:.5;cursor:default}
.pill{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:4px 10px;font-size:12px;font-weight:700;background:var(--surface-2);border:1px solid var(--line)}
.pill::before{content:"";width:8px;height:8px;border-radius:50%;background:currentColor}
.pill.ok{color:var(--good)} .pill.pending{color:var(--warn)} .pill.bad{color:var(--bad)} .pill.idle{color:var(--muted)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0}
.muted{color:var(--muted)}
.small{font-size:13px}
input,select,textarea{font-size:16px!important}
input[type=date],input[type=time]{-webkit-appearance:none;appearance:none;min-height:42px;line-height:22px;display:block}
.grid2.two{align-items:end}
.pv input{font-size:34px!important}
select,input[type=text],input[type=number],input[type=date],textarea{background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:9px 10px;width:100%;min-width:0}
textarea{min-height:80px;resize:vertical}
label.f{display:flex;flex-direction:column;gap:4px;font-size:12px;font-weight:600;color:var(--muted);min-width:0}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}
.cols{display:grid;grid-template-columns:1fr;gap:16px}
@media (min-width:900px){.cols{grid-template-columns:1.25fr 1fr}}
.col{display:flex;flex-direction:column;gap:16px;min-width:0}
.empty{text-align:center;padding:40px 16px;display:flex;flex-direction:column;gap:12px;align-items:center}
.empty h1{font-size:22px}

/* KASSA */
#kassa .head{display:flex;flex-direction:column;gap:4px}
#kassa .ev{font-family:var(--display);font-size:18px}
.pad{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.big{border:0;border-radius:20px;min-height:min(30vh,190px);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;
  font-family:var(--display);font-size:clamp(20px,6vw,30px);font-weight:800;color:#fff;letter-spacing:.02em;
  transition:transform .08s ease, filter .08s ease;touch-action:manipulation;-webkit-user-select:none;user-select:none}
.big span{font-family:var(--body);font-size:14px;font-weight:600;opacity:.85;letter-spacing:0}
.big{-webkit-touch-callout:none}
.big:active{transform:scale(.97);filter:brightness(1.15)}
.big{padding:0 8px;max-width:100%;overflow:hidden}
.big.card{font-size:clamp(14px,4.4vw,28px);letter-spacing:0}
.big.cash{background:var(--cash)} .big.card{background:var(--card)} .big.free{background:var(--free)} .big.tip{background:var(--tip)}
.big:disabled{filter:grayscale(1);opacity:.4}
.flash{position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 18px);transform:translate(-50%,-10px);opacity:0;pointer-events:none;
  background:var(--fg);color:var(--bg);font-weight:700;border-radius:999px;padding:10px 18px;transition:opacity .15s, transform .15s;z-index:40;white-space:nowrap}
.flash.show{opacity:1;transform:translate(-50%,0)}
.mycount{display:flex;gap:8px;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:5px 10px;background:var(--surface-2);border:1px solid var(--line);font-size:13px;font-weight:600}
.dot{width:9px;height:9px;border-radius:50%;display:inline-block;flex:none}
.dot{padding:0!important;border:0!important;width:9px!important;height:9px!important;min-width:0;display:inline-block!important;border-radius:50%!important;vertical-align:middle;box-shadow:none}
.dot.cash{background:var(--cash)} .dot.card{background:var(--card)} .dot.free{background:var(--free)} .dot.tip{background:var(--tip)}
.watch{font-size:12px;color:var(--muted);border-top:1px dashed var(--line);padding-top:10px}

/* lists */
.list{display:flex;flex-direction:column}
.row{display:grid;grid-template-columns:auto auto 1fr auto;gap:10px;align-items:center;padding:9px 0;border-bottom:1px solid var(--line);min-width:0}
.row:last-child{border-bottom:0}
.row .t{font-variant-numeric:tabular-nums;color:var(--muted);font-size:13px;min-width:42px}
.row .who{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .amt{font-weight:700;font-variant-numeric:tabular-nums;text-align:right}
.row.void .amt,.row.void .who{text-decoration:line-through;color:var(--muted)}
.row button.link{background:none;border:0;padding:0;color:var(--accent);font-weight:600;font-size:13px}
.note{grid-column:2 / -1;font-size:13px;background:var(--surface-2);border-radius:8px;padding:6px 8px;min-width:0;overflow-wrap:anywhere}
.note.own{border-left:3px solid var(--accent)}
.tag{font-size:11px;font-weight:700;border-radius:6px;padding:2px 6px;background:var(--surface-2);border:1px solid var(--line);white-space:nowrap}
.tag.bad{color:var(--bad);border-color:var(--bad)} .tag.warn{color:var(--warn);border-color:var(--warn)} .tag.good{color:var(--good);border-color:var(--good)}

/* OWNER */
.meter{display:flex;flex-direction:column;gap:10px}
.meter .figs{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.meter .big-n{font-family:var(--display);font-size:clamp(28px,8vw,44px);font-weight:800;font-variant-numeric:tabular-nums}
.track{height:14px;border-radius:999px;background:var(--surface-2);overflow:hidden;border:1px solid var(--line)}
.track i{display:block;height:100%;background:var(--accent);border-radius:999px;transition:width .5s ease}
.track.done i{background:var(--good)}
.tiles{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
@media (min-width:600px){.tiles{grid-template-columns:repeat(4,1fr)}}
.tile{background:var(--surface-2);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:2px;min-width:0}
.tile b{font-size:22px;font-variant-numeric:tabular-nums}
.tile .lab{font-size:12px;font-weight:600;color:var(--muted);display:flex;align-items:center;gap:6px}
.kv{display:grid;grid-template-columns:1fr auto;gap:6px 12px;font-variant-numeric:tabular-nums}
.kv .tot{font-weight:800;border-top:1px solid var(--line);padding-top:6px}
.stream{display:grid;grid-template-columns:auto 1fr;gap:8px 10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.stream:last-child{border-bottom:0}
.stream .fields{grid-column:1 / -1;display:grid;grid-template-columns:repeat(auto-fit,minmax(100px,1fr));gap:8px}
.stream.off .fields{display:none}
.stream .contrib{grid-column:1 / -1;font-size:13px;color:var(--muted)}
.switch{position:relative;width:44px;height:26px;flex:none}
.switch input{position:absolute;inset:0;opacity:0;margin:0;cursor:pointer}
.switch span{position:absolute;inset:0;border-radius:999px;background:var(--surface-2);border:1px solid var(--line);transition:background .15s}
.switch span::after{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:var(--muted);transition:transform .15s, background .15s}
.switch input:checked + span{background:var(--accent)}
.switch input:checked + span::after{transform:translateX(18px);background:var(--accent-ink)}
.chart{width:100%;overflow-x:auto}
.chart svg{display:block;width:100%;height:auto;min-width:320px}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;font-weight:600;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.tipline{font-size:13px;min-height:20px;font-variant-numeric:tabular-nums}
table{border-collapse:collapse;width:100%;font-size:13px;font-variant-numeric:tabular-nums}
th,td{text-align:left;padding:7px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
th{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.tbl{overflow-x:auto}
.report ul{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:6px}
.report h3{font-size:14px;margin-top:6px}
.hl{color:var(--accent);font-weight:700}

/* sheets */
.sheet{position:fixed;inset:0;background:rgba(10,8,15,.6);display:flex;align-items:flex-end;justify-content:center;z-index:50;
  padding:0 max(0px,env(safe-area-inset-right,0px)) 0 max(0px,env(safe-area-inset-left,0px))}
.sheet .in{background:var(--surface);border:1px solid var(--line);border-radius:18px 18px 0 0;width:100%;max-width:560px;max-height:90vh;overflow:auto;
  padding:18px max(16px,env(safe-area-inset-right,0px)) calc(18px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:12px}
@media (min-width:700px){.sheet{align-items:center}.sheet .in{border-radius:18px}}
.sheet h3{font-size:18px}
.quick{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.quick button{border:1px solid var(--line);background:var(--surface-2);border-radius:12px;padding:14px 0;font-weight:700;font-size:16px}
.quick button.on{background:var(--accent);color:var(--accent-ink);border-color:transparent}
.seg{display:flex;border:1px solid var(--line);border-radius:999px;overflow:hidden}
.seg button{flex:1;border:0;background:transparent;padding:10px 14px;font-weight:700;white-space:nowrap}
.seg button.on{background:var(--fg);color:var(--bg)}
.actions{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}

/* celebration */
.party{position:fixed;inset:0;z-index:60;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:8px;
  background:radial-gradient(circle at 50% 45%, rgba(62,207,142,.35), rgba(10,8,15,.85) 70%);text-align:center;padding:24px}
.party h1{font-size:clamp(34px,11vw,72px);font-weight:800;color:#fff;animation:pop .6s cubic-bezier(.2,1.6,.4,1)}
.party p{color:#fff;font-weight:600;margin:0}
@keyframes pop{from{transform:scale(.4);opacity:0}to{transform:scale(1);opacity:1}}
@media (prefers-reduced-motion: reduce){.party h1{animation:none}.track i{transition:none}.big{transition:none}}

/* tabs & lanes */
.panel{display:flex;flex-direction:column;gap:16px;max-width:760px;margin:0 auto;width:100%}
#owner{padding-bottom:calc(76px + env(safe-area-inset-bottom,0px))}
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;display:grid;grid-template-columns:repeat(5,1fr);gap:2px;background:var(--surface);border-top:1px solid var(--line);
  padding:6px max(10px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(10px,env(safe-area-inset-left,0px))}
.tabs button{position:relative;border:0;background:transparent;border-radius:12px;padding:12px 2px;font-weight:700;font-size:clamp(10px,2.9vw,13px);overflow:hidden;text-overflow:ellipsis;color:var(--muted)}
.tabs button.on{background:var(--surface-2);color:var(--fg)}
.badge{position:absolute;top:2px;right:2px;min-width:18px;height:18px;border-radius:9px;background:var(--bad);color:#fff;font-size:11px;line-height:18px;padding:0 5px}
.scen{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;align-items:baseline;padding:10px 0;border-bottom:1px solid var(--line)}
.scen:last-child{border-bottom:0}
.scen b{font-family:var(--display);font-size:22px;font-variant-numeric:tabular-nums;text-align:right;min-width:4ch}
.scen .or{grid-column:1 / -1;font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.lane{display:flex;flex-direction:column;gap:6px;padding:10px 0;border-bottom:1px solid var(--line)}
.lane:last-child{border-bottom:0}
.lane svg{display:block;width:100%;height:auto}
.live-dot{width:8px;height:8px;border-radius:50%;background:var(--muted);display:inline-block}
.live-dot.on{background:var(--good);box-shadow:0 0 0 3px color-mix(in srgb, var(--good) 25%, transparent)}
/* steps, sources, boxes, roles */
.step{display:flex;align-items:center;gap:10px}
.step h3{font-size:16px}
.sn{width:26px;height:26px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;background:var(--accent);color:var(--accent-ink);font-weight:800;font-size:13px;flex:none}
.src{border:1px solid var(--line);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:10px}
.src + .src{margin-top:8px}
.src.on{border-color:var(--accent)}
.srchead{display:flex;align-items:center;gap:12px;cursor:pointer}
.src .fields{display:none;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px}
.src.on .fields{display:grid}
.note-s{grid-column:1 / -1;margin:0;font-size:12px;color:var(--muted)}
.checks{display:flex;flex-direction:column;gap:6px;margin:0;padding:0;list-style:none}
.checks li{display:flex;gap:8px;align-items:center;font-size:14px}
.checks .ok{color:var(--good)} .checks .no{color:var(--warn)}
.stepper{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center}
.stepper .btn{padding:14px 16px;font-size:16px}
.pv{display:flex;align-items:center;justify-content:center;gap:4px;font-family:var(--display);font-size:34px;font-weight:800}
.pv input{width:4.2ch;background:transparent;border:0;border-bottom:2px solid var(--line);border-radius:0;font:inherit;text-align:center;padding:0}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.boxes{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
@media (min-width:600px){.boxes{grid-template-columns:repeat(3,1fr)}}
.box{background:var(--surface-2);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:4px;min-width:0}
.box .lab{font-size:12px;font-weight:700;color:var(--muted);display:flex;align-items:center;gap:6px}
.box b{font-size:20px;font-variant-numeric:tabular-nums}
.box input{padding:6px 8px;font-size:16px;font-weight:700}
.box .sub{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.box.res b{font-family:var(--display)}
.roles{display:grid;gap:12px}
.role{border:1px solid var(--line);background:var(--surface);border-radius:18px;padding:20px;text-align:left;display:flex;flex-direction:column;gap:4px}
.role b{font-family:var(--display);font-size:20px}
.role span{color:var(--muted)}
.pinrow{display:flex;gap:8px}
.pinrow input{font-size:24px;letter-spacing:.3em;text-align:center}
.grid2.two{grid-template-columns:1fr 1fr}
label.f .hint{display:block;font-weight:500;font-size:11px;color:var(--muted)}
.checks .no-t{color:var(--warn);font-size:12px;margin-left:auto}
.lines{display:flex;flex-direction:column}
.btn.green{background:var(--cash);color:#fff;border-color:transparent}
.btn.red{background:transparent;color:var(--bad);border-color:var(--bad)}
#o-evsel{background:var(--accent);color:var(--accent-ink);border-color:transparent;font-weight:700;border-radius:999px;padding:9px 14px}
.sum{display:grid;grid-template-columns:1fr auto;gap:2px 12px;align-items:baseline}
.sum .k{font-size:13px;font-weight:600;color:var(--muted)}
.sum .v{font-variant-numeric:tabular-nums;text-align:right;font-weight:700;font-size:20px}
.sum .v.vbig{font-family:var(--display);font-size:clamp(26px,7vw,38px);font-weight:800}
.sum .rule{grid-column:1 / -1;border-top:1px solid var(--line);margin:6px 0}
.ln{display:grid;grid-template-columns:1fr auto;gap:4px 12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.lines .ln:last-child,.card > .ln:last-child{border-bottom:0}
.ln .sub{display:block;font-size:12px;color:var(--muted);font-weight:500}
.ln .val{text-align:right;font-variant-numeric:tabular-nums;font-weight:700}
.ln .val .sub{font-weight:500}
.ln.tot{border-top:2px solid var(--fg);border-bottom:0;margin-top:4px}
.ln .ins{grid-column:1 / -1;display:flex;gap:8px;flex-wrap:wrap}
.ln .ins label{flex:1;min-width:120px}
.lnin{width:9ch;text-align:right;font-weight:700;font-size:16px}
.big.wide{grid-column:1 / -1;min-height:min(16vh,110px)}
</style>
</head>
<body>

<div class="wrap" id="app">
  <div class="empty" id="boot"><h1>BEPCAL</h1><p class="muted">Verbinden…</p></div>
</div>

<div class="flash" id="flash" role="status" aria-live="polite"></div>

<!-- ROLKEUZE -->
<template id="tpl-role">
  <section class="wrap" style="max-width:520px">
    <div class="brand" style="font-size:28px">BEPCAL<small>Kassa &amp; break-even</small></div>
    <p class="muted" style="margin:0">Wie ben je vanavond?</p>
    <div class="roles">
      <button class="role" id="r-kassa"><b>Kassamedewerker</b><span>Naam ingeven, station kiezen en tikken.</span></button>
      <button class="role" id="r-mgmt"><b>Management</b><span>Avond voorbereiden en alles live opvolgen. Met code.</span></button>
    </div>
  </section>
</template>

<!-- KASSA -->
<template id="tpl-kassa">
  <section id="kassa" class="wrap">
    <div class="bar">
      <div class="brand">BEPCAL<small id="k-who">Kassa</small></div>
      <div class="spacer"></div>
      <span class="pill idle" id="k-sync">Verbinden</span>
      <button class="btn" id="k-switch">Wissel</button>
      <button class="btn red" id="k-out">Afmelden</button>
    </div>
    <div class="card" id="k-closed" hidden>

  try{
    let u = BEP.auth.currentUser;
    if (!u || !u.isAnonymous){ if (u) await BEP.signOut(); u = (await BEP.signInAnon()).user; }
    await waitFor(() => S.authUid === u.uid, 4000);
    await S.db.doc("toegang/" + u.uid).set({ code: String(code), at: Date.now() });
    LS.set("bep:kcode", String(code)); LS.set("bep:joined", u.uid);
    startData();
    await waitFor(() => S.loaded, 6000);
    return true;
  }catch(e){ err(e); return false; }
}
function askKassaCode(){
  sheet(`<h3>Kassacode</h3>
    <p class="small muted" style="margin:0">Vraag de code aan de organisatie. Je geeft ze maar één keer in op dit toestel.</p>

    <p class="small" id="kc-err" style="margin:0;color:var(--bad)" hidden></p>
    <div class="actions"><button class="btn" id="kc-x">Annuleren</button><button class="btn primary" id="kc-ok">Verder</button></div>`, r => {
    const fail = m => { const e = $("#kc-err", r); e.textContent = m; e.hidden = false; };
    const go = async () => {
      const lock = num(SS.get("bep:lock"));
      if (lock > Date.now()) return fail(`Te veel foute pogingen. Probeer opnieuw over ${Math.ceil((lock - Date.now())/1000)} seconden.`);
      const c = $("#kc-in", r).value.trim(); if (!c) return;

      ok.disabled = false; ok.textContent = "Verder";
      if (!good){
        const n = num(SS.get("bep:tries")) + 1; SS.set("bep:tries", String(n));
        if (n >= 5){ SS.set("bep:tries", "0"); SS.set("bep:lock", String(Date.now() + 60000)); return fail("Te veel foute pogingen. Wacht 1 minuut."); }

      SS.set("bep:tries", "0"); closeSheet(); pickEvent();
    };
    $("#kc-x", r).onclick = closeSheet; $("#kc-ok", r).onclick = go;

let lastTap = {};
let wl = null;
async function wake(){ try{ if (S.mode === "kassa" && navigator.wakeLock && !wl){ wl = await navigator.wakeLock.request("screen"); wl.addEventListener("release", () => wl = null); } }catch{} }
function initKassa(){
  $("#k-switch").onclick = () => sheet(`<h3>Wisselen</h3>
    <div class="roles">
      <button class="role" id="w-st"><b>Ander station</b><span>Bijvoorbeeld van de inkom naar de WC.</span></button>

      <button class="role" id="w-nm"><b>Andere persoon</b><span>Iemand anders neemt deze kassa over.</span></button>

    $("#w-ev", r).onclick = () => { closeSheet(); S.mode = "role"; LS.set("bep:role",""); mount(); pickEvent(); };

    <div class="actions"><button class="btn" id="ko-x">Annuleren</button><button class="btn danger" id="ko-ok">Afmelden</button></div>`, r => {

    $("#ko-ok", r).onclick = () => logoutAll("Afgemeld");

  document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible") wake(); });

function paintWho(){ const w = $("#k-who"); if (!w) return; const ev = kassaEvent(); const st = ev && streamsOf(ev).find(s => s.id === S.k.station); w.textContent = S.k.name + (st ? " · " + stationLabel(st) : ""); }
function stationsFor(ev){ return ev ? streamsOf(ev).filter(isStation) : []; }
function askStation(auto){
  const ev = kassaEvent();
  const list = stationsFor(ev);
  if (!list.length){ if (!auto) flash("Er zijn nog geen stations voor vanavond"); return; }
  if (auto && list.length === 1){ setStation(list[0].id); return; }
  sheet(`<h3>Waar sta je?</h3>
    <div class="roles">${list.map(s => `<button class="role" data-st="${esc(s.id)}"><b>${esc(stationLabel(s))}</b><span>${s.id === "door" ? "Tickets aan de deur" : s.id === "wc" ? "WC-bezoeken" : s.mode === "price" ? "Vaste prijs per stuk" : "Verkoop met bedrag"}</span></button>`).join("")}</div>`, r => {
    r.querySelectorAll("[data-st]").forEach(b => b.onclick = () => { setStation(b.dataset.st); closeSheet(); });
  });
}
async function setStation(id){
  S.k.station = id; LS.set("bep:station", id); paintWho(); renderKassa();
  if (S.uid){ try{ await writeKassaDoc(); }catch(e){ handleWriteErr(e); } }
}

async function kassaData(){
  if (S.mode !== "kassa" || !$("#k-open")) return;
  const sl = staffList();
  if (S.events.length && (!kassaEvent() || !pickable(kassaEvent()))){ LS.set("bep:role", ""); S.mode = "role"; mount(); pickEvent(); return; }
  if (sl.length && !sl.includes(S.k.name)){ S.k.name = ""; LS.set("bep:name", ""); LS.set("bep:role", ""); S.mode = "role"; mount(); askName(S.k.evId); return; }
  const ev = kassaEvent();
  const open = isOpen(ev);
  const cl = $("#k-closed");
  $("#k-open").hidden = !open; cl.hidden = open;
  if (!ev || ev.status === "draft"){ $("#k-closed-title").textContent = "De kassa staat dicht"; $("#k-closed-sub").textContent = "Zodra de organisatie de avond start, verschijnen hier de knoppen."; }
  else if (!open && ev.status === "open"){ $("#k-closed-title").textContent = "De kassa is gesloten"; $("#k-closed-sub").textContent = "De kassa sloot om " + ev.closeTime + ". Vraag de organisatie als ze langer open moet."; }
  else if (!open){ $("#k-closed-title").textContent = ev.name + " is afgesloten"; $("#k-closed-sub").textContent = "Bekijk hieronder je afsluitrapport en verantwoord eventuele verschillen."; }
  if (ev) $("#k-ev").textContent = ev.name + (ev.location ? " · " + ev.location : "");
  if (open){
    const list = stationsFor(ev);
    if (!list.some(s => s.id === S.k.station) && list.length && !$("#sheet")) askStation(true);
  }
  paintWho();
  if (ev && S.uid && S.k.ev !== ev.id) await loadKassaEvent(ev.id);
  if (ev) watchKassaExtras(ev.id);
  renderKassa();
}

async function writeKassaDoc(){
  const evs = LS.get("bep:evs:" + S.uid, []);
  if (S.k.evId && !evs.includes(S.k.evId)){ evs.push(S.k.evId); LS.set("bep:evs:" + S.uid, evs.slice(-30)); }
  await S.db.doc("kassa/" + S.uid).set({ name: S.k.name, station: S.k.station || "", since: Date.now(), evs: evs.slice(-30) });
}
function kref(evId){ return S.db.doc("kassa/" + S.uid + "/events/" + evId); }
async function loadKassaEvent(evId){
  S.k.ev = evId;
  S.k.confirmed = S.k.confirmedAt ? {name: S.k.name, at: S.k.confirmedAt} : null;
  const local = LS.get("bep:k:" + evId, {entries:[], explain:{}});
  S.k.entries = local.entries || []; S.k.explain = local.explain || {};
  renderKassa();
  try{
    const s = await kref(evId).get();
    const server = s.exists ? s.data() : {entries:[], explain:{}};
    S.k.entries = mergeEntries(server.entries || [], S.k.entries);
    if (!S.k.confirmed && server.confirmed) S.k.confirmed = server.confirmed;
    S.k.explain = Object.assign({}, server.explain || {}, S.k.explain);
    S.k.synced = JSON.stringify({e:server.entries||[], x:server.explain||{}});
    persist();
    if (S.k.synced !== JSON.stringify({e:S.k.entries, x:S.k.explain})) flush(); else setSync("ok","Alles verzonden");
    await writeKassaDoc();
  }catch(e){ if (!handleWriteErr(e)){ setSync("pending","Offline, wordt bewaard"); scheduleRetry(); } }
  renderKassa();
}
function mergeEntries(a, b){
  const m = new Map();
  for (const e of [...a, ...b]){ const o = m.get(e.id); if (!o || Math.max(e.nt||0, e.xt||0) > Math.max(o.nt||0, o.xt||0)) m.set(e.id, e); }
  return [...m.values()].sort((x,y) => x.t - y.t);
}
function persist(){ if (S.k.ev) LS.set("bep:k:" + S.k.ev, {entries:S.k.entries, explain:S.k.explain}); }
function setSync(cls, txt){ const p = $("#k-sync"); if (!p) return; p.className = "pill " + cls; p.textContent = txt; }
function handleWriteErr(e){
  if (e && e.code === "invalid_argument"){ S.k.denied = true; setSync("bad","Geen toegang"); flash("Geen toegang meer. Meld je af en geef de kassacode opnieuw in."); return true; }
  if (e && e.code === "quota_exceeded"){ setSync("bad","Opslag vol"); flash("Opslag vol: verwittig de organisatie"); return true; }
  return false;
}
function scheduleRetry(){ if (S.k.retry || S.k.denied) return; S.k.retry = setTimeout(() => { S.k.retry = null; flush(); }, 5000); }
async function flush(){
  if (!S.k.ev || !S.uid || S.k.denied) return;
  if (S.k.writing){ S.k.again = true; return; }
  S.k.writing = true;
  const body = { entries: S.k.entries.slice(), explain: Object.assign({}, S.k.explain), name: S.k.name, confirmed: S.k.confirmed || null };
  const json = JSON.stringify({e:body.entries, x:body.explain});
  setSync("pending", navigator.onLine === false ? "Offline · wordt bewaard" : "Verzenden");
  try{ await kref(S.k.ev).set(body); S.k.synced = json; }
  catch(e){ if (!handleWriteErr(e)){ setSync("pending", "Geen verbinding · wordt bewaard"); scheduleRetry(); } }
  S.k.writing = false;
  if (S.k.again){ S.k.again = false; flush(); return; }
  if (S.k.synced === JSON.stringify({e:S.k.entries, x:S.k.explain})) setSync("ok","Alles verzonden");
}

function stationPrice(ev, sid){
  if (sid === "door") return num(ev.prices && ev.prices.cash);
  const s = streamsOf(ev).find(x => x.id === sid);
  if (s && s.id === "wc") return num(s.price);
  if (s && s.custom && s.mode === "price"){ const l = priceList(s.price); return l.length > 1 ? l : (l[0] || 0); }
  return null; // bedrag ingeven
}
function addEntry(k, p, extra){
  S.k.entries.push(Object.assign({ id: rid(), t: Date.now(), k, p: Math.round(p*100)/100, s: S.k.station || "door" }, extra || {}));
  persist(); flush(); vibrate(30); renderKassa();
}
function tap(k){
  const ev = kassaEvent();
  if (!isOpen(ev) || !S.uid || !S.k.station) return;
  const now = Date.now();
  if (now - (lastTap[k]||0) < 300) return;
  lastTap[k] = now;
  if (k === "tip") return askAmount("Fooi registreren", true, (a, m) => { addEntry("tip", a, {m}); flash(`Fooi ${eur(a)} geregistreerd`); });
  const price = stationPrice(ev, S.k.station);
  if (k !== "free" && price === null) return askAmount(`${KIND[k]} · bedrag`, false, a => { addEntry(k, a); flash(`${KIND[k]} ${eur(a)} geregistreerd`); });

/* ----- compute ----- */
function priceAt(ev, t){
  const log = (ev.priceLog || []).slice().sort((a,b) => a.at - b.at);
  let p = num(ev.prices && ev.prices.cash);
  for (const l of log){ if (l.at <= t) p = num(l.cash); else break; }
  return p;
}
function compute(evId){
  const ev = eventById(evId); if (!ev) return null;
  const corr = (S.corr[evId] && S.corr[evId].items) || {};
  const streams = streamsOf(ev);
  const rows = [];
  for (const [uid, doc] of Object.entries(S.kd[evId] || {})){
    for (const e of (doc.entries || [])){
      const key = uid + ":" + e.id, c = corr[key], s = e.s || "door";
      let k = e.k, p = e.p, isVoid = !!e.x;
      if (c && !e.x){
        if (c.action === "void") isVoid = true;
        else if (e.k !== "tip"){ k = c.action; p = k === "free" ? 0 : (e.k === "free" ? (s === "door" ? priceAt(ev, e.t) : num((streams.find(x => x.id === s) || {}).price)) : e.p); }
      }
      rows.push({uid, e, key, c, k, p, s, void:isVoid, self:!!e.x, explain:(doc.explain||{}), name:doc.name});
    }
  }
  rows.sort((a,b) => b.e.t - a.e.t);
  const live = rows.filter(r => !r.void);
  const T = {cashN:0,cashS:0,cardN:0,cardS:0,freeN:0,tipCash:0,tipCard:0,tipN:0,voidN:rows.length-live.length, allCash:0, allCard:0};
  const tapped = {};
  live.forEach(r => {
    if (r.k === "tip"){ T.tipN++; if (r.e.m === "card") T.tipCard += r.p; else T.tipCash += r.p; return; }
    if (r.k === "cash") T.allCash += r.p; if (r.k === "card") T.allCard += r.p;
    const t = tapped[r.s] = tapped[r.s] || {n:0, sum:0, cash:0, card:0, free:0};
    t.n++; t.sum += r.p; t[r.k] += r.k === "free" ? 1 : r.p;
    if (r.s === "door"){
      if (r.k === "cash"){ T.cashN++; T.cashS += r.p; }
      else if (r.k === "card"){ T.cardN++; T.cardS += r.p; }
      else if (r.k === "free") T.freeN++;
    }
  });
  T.door = T.cashS + T.cardS; T.inN = T.cashN + T.cardN + T.freeN;
  let gross = 0, net = 0, exTotal = 0; const per = [];
  streams.forEach(s => {
    const tp = tapped[s.id] || {n:0, sum:0};
    let amount, manual = 0;
    if (s.id === "door") amount = T.door;
    else if (s.id === "wc"){ manual = num(s.price) * num(s.count); amount = tp.sum + manual; }
    else { manual = num(s.amount); amount = tp.sum + manual; }
    const vat = num(s.vat), margin = sMargin(s);
    const exVat = amount / (1 + vat/100);
    const contrib = margin === null ? 0 : exVat * margin / 100;
    per.push({s, amount, manual, tapped:tp, exVat, contrib, margin, unit: margin === null ? 0 : 1/(1+vat/100)*margin/100, missing: s.on && margin === null});
    if (s.on){ gross += amount; net += contrib; exTotal += exVat; }
  });
  const cost = num(ev.cost);
  const online = streams.find(s => s.id === "online");
  T.onlineN = online && online.on ? Math.round(num(online.count)) : 0;
  return {ev, streams, rows, live, T, per, gross, net, exTotal, cost, result: net - cost, pct: cost ? Math.min(100, net/cost*100) : 0};
}

function renderScenarios(C){
  const box = $("#o-scen"), ev = C.ev;
  if (!C.cost){ $("#o-scen-h").textContent = "Tot break-even"; box.innerHTML = '<p class="muted small" style="margin:0">Vul de kosten van de avond in bij Gegevens om te zien wat je nog moet verkopen.</p>'; return; }
  const rem = C.cost - C.net;
  const P = id => C.per.find(p => p.s.id === id);
  const door = P("door"), online = P("online");
  const pend = S.pending !== null && S.pending !== undefined;
  const price = pend ? S.pending : num(ev.prices && ev.prices.cash);
  const tVat = door.s.on ? num(door.s.vat) : num(online.s.vat);
  const perTicket = (door.s.on || online.s.on) ? price / (1 + tVat/100) : 0;
  const flex = C.per.filter(p => p.s.on && !sFixed(p.s) && p.unit > 0);
  const fixed = C.per.filter(p => p.s.on && sFixed(p.s) && p.s.id !== "door" && p.s.id !== "online");
  $("#o-scen-h").textContent = rem <= 0 ? "Break-even behaald" : "Tot break-even";
  if (rem <= 0){
    box.innerHTML = `<p style="margin:0">Alles wat nu nog binnenkomt is winst.${perTicket ? ` Elk extra ticket brengt ${eur(perTicket)} op.` : ""}</p>`;
    return;
  }
  const n = v => Math.ceil(v).toLocaleString("nl-BE");
  const L = [];
  if (perTicket > 0) L.push([n(rem / perTicket), `tickets (deur of online) à ${eur(price)}`, `${eur(perTicket)} per ticket zonder ${tVat}% btw`]);
  flex.forEach(p => { const x = Math.ceil(rem / p.unit); L.push([eur0(x), `extra ${esc(sName(p.s).toLowerCase())}, incl. btw`, `${esc(sName(p.s))} komt dan op ${eur0(p.amount + x)} in totaal · bij ${num(p.s.vat)}% btw en ${p.margin}% marge blijft ${eur(p.unit * 100)} over per €100`]); });

/* ----- statistieken ----- */
function staffStats(C){
  const rc = S.recon[C.ev.id]; const rr = rc && rc.result && rc.result.byUid || {};
  const groups = {};
  Object.keys(S.kd[C.ev.id] || {}).forEach(u => { (groups[who(u)] = groups[who(u)] || []).push(u); });
  return Object.values(groups).map(uids => {
    const uid = uids[0], has = r => uids.includes(r.uid);
    const ts = C.live.filter(r => has(r) && r.k !== "tip").map(r => r.e.t).sort((a,b)=>a-b);
    const n = ts.length;

    gaps.sort((a,b)=>a-b);
    const mine = C.rows.filter(has);
    const rsum = k => uids.reduce((a, u) => a + (rr[u] && rr[u][k] || []).length, 0);
    return {uid, uids, n, peak, perHour, med: gaps.length ? gaps[Math.floor(gaps.length/2)]/1000 : null, first: ts[0], last: ts[n-1],
      corr: mine.filter(r => r.c && !r.self).length, selfX: mine.filter(r => r.self).length, notes: mine.filter(r => r.e.n).length,

}

function bins(C, all){
  const ts = C.live.filter(r => r.k !== "tip" && (all || r.s === "door"));

  const min = Math.min(...ts.map(r => r.e.t)), max = Math.max(...ts.map(r => r.e.t), all ? Date.now() : 0);
  const span = max - min;

  const start = Math.floor(min / size) * size, end = Math.floor(Math.min(max, min + 14*3600000) / size) * size;
  const B = [];
  for (let t = start; t <= end; t += size) B.push({t, cash:0, card:0, free:0});
  ts.forEach(r => { const i = Math.floor((r.e.t - start) / size); if (B[i]) B[i][r.k]++; });
  return {B, size};
}

}
function priceLevels(C){

function parseCSV(text){
  const first = text.split(/\r?\n/)[0] || "";
  const d = [";", ",", "\t"].sort((a,b) => first.split(b).length - first.split(a).length)[0];
  const rows = []; let row = [], cur = "", q = false;
  for (let i = 0; i < text.length; i++){
    const c = text[i];
    if (q){ if (c === '"'){ if (text[i+1] === '"'){ cur += '"'; i++; } else q = false; } else cur += c; }
    else if (c === '"') q = true;
    else if (c === d){ row.push(cur); cur = ""; }
    else if (c === "\n" || c === "\r"){ if (c === "\r" && text[i+1] === "\n") i++; row.push(cur); rows.push(row); row = []; cur = ""; }
    else cur += c;
  }
  if (cur || row.length){ row.push(cur); rows.push(row); }
  return rows.filter(r => r.some(x => x.trim()));
}
function parseWhen(dateStr, timeStr){
  const s = (dateStr + " " + (timeStr || "")).trim();
  let m = s.match(/(\d{4})-(\d{1,2})-(\d{1,2})[ T]?(\d{1,2})?:?(\d{2})?:?(\d{2})?/);
  if (m) return new Date(+m[1], +m[2]-1, +m[3], +(m[4]||0), +(m[5]||0), +(m[6]||0)).getTime();
  m = s.match(/(\d{1,2})[./-](\d{1,2})[./-](\d{2,4})[ ,T]*(\d{1,2})?:?(\d{2})?:?(\d{2})?/);
  if (m){ const y = +m[3] < 100 ? 2000 + +m[3] : +m[3]; return new Date(y, +m[2]-1, +m[1], +(m[4]||0), +(m[5]||0), +(m[6]||0)).getTime(); }
  const t = Date.parse(s); return isNaN(t) ? null : t;
}
function parseAmt(v){
  let s = String(v || "").replace(/[^\d,.\-]/g, "");
  if (s.includes(",") && s.includes(".")) s = s.lastIndexOf(",") > s.lastIndexOf(".") ? s.replace(/\./g,"").replace(",", ".") : s.replace(/,/g,"");
  else s = s.replace(",", ".");
  const n = parseFloat(s); return isFinite(n) ? n : null;
}

function matchSumup(C, tx){
  const taps = C.live.filter(r => r.k === "card" || (r.k === "tip" && r.e.m === "card")).map(r => ({r, used:false}));
  const res = {byUid:{}, orphan:[], matched:0};
  const add = (uid, key, val) => { (res.byUid[uid] = res.byUid[uid] || {taps:[], tx:[]})[key].push(val); };
  const txs = tx.slice().sort((a,b) => a.t - b.t).map(x => ({x, used:false}));
  const near = (t, x) => Math.abs(t - x.t) <= WINDOW;
  // pass 1: exact amount
  txs.forEach(o => {
    let best = null, bd = Infinity;
    taps.forEach(p => { if (p.used || p.r.k === "tip" || !near(p.r.e.t, o.x) || Math.abs(p.r.p - o.x.a) > 0.009) return; const dd = Math.abs(p.r.e.t - o.x.t); if (dd < bd){ bd = dd; best = p; } });
    if (best){ best.used = true; o.used = true; res.matched++; }
  });
  // pass 2: ticket + card tip in one payment
  txs.forEach(o => {
    if (o.used) return;
    const cands = taps.filter(p => !p.used && near(p.r.e.t, o.x));
    for (const a of cands) for (const b of cands){
      if (a === b || a.r.k !== "card" || b.r.k !== "tip" || a.r.uid !== b.r.uid) continue;
      if (Math.abs(a.r.p + b.r.p - o.x.a) < 0.01 && !o.used){ a.used = b.used = o.used = true; res.matched++; }
    }
  });
  // pass 3: tip alone / price changed mid-night: nearest card tap within window
  txs.forEach(o => {
    if (o.used) return;
    let best = null, bd = Infinity;
    taps.forEach(p => { if (p.used || !near(p.r.e.t, o.x)) return; if (p.r.k === "tip" && Math.abs(p.r.p - o.x.a) > 0.009) return; const dd = Math.abs(p.r.e.t - o.x.t); if (dd < bd){ bd = dd; best = p; } });
    if (best && Math.abs(best.r.p - o.x.a) < 0.009){ best.used = true; o.used = true; res.matched++; }
  });
  taps.forEach(p => { if (!p.used) add(p.r.uid, "taps", p.r.e.id); });
  // attribute unmatched SumUp payments to the cashier who was tapping around that time
  const all = C.live.filter(r => r.k !== "tip");
  txs.forEach(o => {
    if (o.used) return;
    const around = new Map();
    all.forEach(r => { const d = Math.abs(r.e.t - o.x.t); if (d <= 15*60000) around.set(r.uid, Math.min(around.get(r.uid) ?? Infinity, d)); });
    if (around.size === 1) add([...around.keys()][0], "tx", o.x);
    else if (around.size > 1){ const uid = [...around.entries()].sort((a,b)=>a[1]-b[1])[0][0]; add(uid, "tx", {...o.x, guess:true}); }
    else res.orphan.push(o.x);
  });
  return res;
}

  const result = matchSumup(C, tx);
  const doc = {tx, file: fname || (S.recon[S.sel] && S.recon[S.sel].file) || "", at: Date.now(), result};
  S.recon[S.sel] = doc; onData();

  if (ev.breakEvenAt) fin.push(`Break-even bereikt om <b>${hm(ev.breakEvenAt)}</b>${ev.startedAt ? `, ${Math.round((ev.breakEvenAt - ev.startedAt)/60000)} minuten na de start` : ""}.`);
  else if (C.cost) fin.push(`Break-even ${final ? "niet gehaald" : "nog niet gehaald"}: er ontbreekt ${eur(C.cost - C.net)}.`);
  C.per.filter(p => p.s.on && p.amount > 0).sort((a,b) => b.contrib - a.contrib).forEach(p => fin.push(`<b>${esc(sName(p.s))}</b> · ${pct(p.contrib, C.net)}% · ${eur0(p.amount)} bruto · ${eur0(p.contrib)} na btw en marge`));
  C.per.filter(p => p.missing && p.amount > 0).forEach(p => fin.push(`<span class="tag warn">Let op</span> ${esc(sName(p.s))} heeft geen marge en telt niet mee.`));
  L.push(["Financieel", fin]);
  // bezoekers
  const door = [];
  const paid = T.cashN + T.cardN, visitors = T.inN + T.onlineN;
  if (visitors) door.push(`<b>${visitors}</b> bezoekers geregistreerd: ${T.onlineN} online tickets, ${paid} betaald aan de deur, ${T.freeN} gratis.`);
  if (T.onlineN && paid) door.push(`${pct(T.onlineN, T.onlineN + paid)}% van de betalende bezoekers kocht online, ${pct(paid, T.onlineN + paid)}% aan de deur.`);
  if (paid) door.push(`Aan de deur betaalde ${pct(T.cardN, paid)}% met Bancontact en ${pct(T.cashN, paid)}% cash. Gemiddelde deurprijs ${eur(T.door / paid)}.`);
  if (T.inN) door.push(`${pct(T.freeN, T.inN)}% van de deurbezoekers kwam gratis binnen.`);
  const bar = C.per.find(p => p.s.id === "bar");
  if (bar && bar.s.on && bar.amount > 0 && visitors) door.push(`Dranken per bezoeker: ${eur(bar.amount / visitors)} bruto.`);
  const food = C.per.find(p => p.s.id === "food");
  if (food && food.s.on && food.amount > 0 && visitors) door.push(`Food per bezoeker: ${eur(food.amount / visitors)} bruto.`);
  if (T.tipN) door.push(`${T.tipN} fooien voor ${eur(T.tipCash + T.tipCard)} (${eur(T.tipCash)} cash, ${eur(T.tipCard)} Bancontact).`);
  L.push(["Bezoekers & verkoop", door]);
  // uren
  const tim = [];
  if (doorTs.length){
    tim.push(`Eerste deurbezoeker om ${hm(doorTs[0])}, laatste om ${hm(doorTs[doorTs.length-1])}.`);
    let best = 0, bi = 0, j = 0; for (let i = 0; i < doorTs.length; i++){ while (doorTs[i] - doorTs[j] > 3600000) j++; if (i - j + 1 > best){ best = i - j + 1; bi = j; } }
    tim.push(`Drukste uur aan de deur: vanaf <b>${hm(doorTs[bi])}</b> met ${best} mensen (${pct(best, doorTs.length)}% van alle deurbezoekers).`);
    if (bb){ const pk = bb.B.reduce((a,b) => (b.cash+b.card+b.free) > (a.cash+a.card+a.free) ? b : a); tim.push(`Drukste ${bb.size === 900000 ? "kwartier" : "halfuur"}: ${hm(pk.t)}–${hm(pk.t + bb.size)} met ${pk.cash+pk.card+pk.free} mensen.`); }
    if (doorTs.length >= 4){ const q1 = doorTs[Math.floor(doorTs.length*.25)], q3 = doorTs[Math.floor(doorTs.length*.75)]; tim.push(`De helft van de deurbezoekers kwam binnen tussen ${hm(q1)} en ${hm(q3)}.`); }
    if (ev.startTime){ const s0 = doorTs[0]; tim.push(`Om ${hm(doorTs[Math.floor(doorTs.length/2)])} was de helft van de deurbezoekers binnen.`); }
  }
  const lv = priceLevels(C).filter(x => x.perHour !== null);
  if (lv.length > 1){
    const bestL = lv.slice().sort((a,b) => b.perHour * b.price - a.perHour * a.price)[0];
    tim.push(`De deurprijs veranderde ${lv.length - 1} keer. Meeste omzet per uur aan ${eur(bestL.price)}: ${Math.round(bestL.perHour)} tickets per uur.`);
  }
  if (tim.length) L.push(["Uren & prijzen", tim]);
  // personeel
  const st = staffStats(C); const staff = [];
  const ranked = st.filter(s => s.perHour).sort((a,b) => b.perHour - a.perHour);
  if (st.length > 1){ const e = st.map(x => ({x, f: x.selfX + x.corr + x.tapsNoSumup + x.sumupNoTap})).sort((a,b) => a.f - b.f); if (e[0].f !== e[e.length-1].f) staff.push(`Minste fouten: <b>${esc(who(e[0].x.uid))}</b> (${e[0].f}), meeste: <b>${esc(who(e[e.length-1].x.uid))}</b> (${e[e.length-1].f}).`); }
  if (ranked.length > 1){ const a = ranked[0], b = ranked[ranked.length-1]; staff.push(`Snelste tempo: <b>${esc(who(a.uid))}</b> met ${Math.round(a.perHour)} registraties per actief uur, tegenover ${Math.round(b.perHour)} bij ${esc(who(b.uid))} (${(a.perHour/b.perHour).toFixed(1).replace(".",",")}× zo snel).`); }
  st.forEach(s => {
    const bits = [`${s.n} registraties`];
    if (s.perHour) bits.push(`${Math.round(s.perHour)} per actief uur`);
    bits.push(`piek ${s.peak} in één uur`);
    if (s.med >= 1) bits.push(`${Math.round(s.med)} s tussen twee klanten bij drukte`);
    bits.push(`${s.selfX + s.corr + s.tapsNoSumup + s.sumupNoTap} fouten`);
    if (s.selfX) bits.push(`${s.selfX} zelf geannuleerd`);
    if (s.corr) bits.push(`${s.corr} gecorrigeerd door management`);
    if (s.tapsNoSumup || s.sumupNoTap) bits.push(`<span class="tag bad">${s.tapsNoSumup + s.sumupNoTap} SumUp-verschil${s.tapsNoSumup + s.sumupNoTap === 1 ? "" : "len"}</span>`);
    if (s.first) bits.push(`actief ${hm(s.first)}–${hm(s.last)}`);
    staff.push(`<b>${esc(who(s.uid))}</b>: ${bits.join(" · ")}.`);
  });
  if (staff.length) L.push(["Personeel", staff]);
  // controle
  const ctl = [];
  const expect = num(ev.float) + T.allCash + T.tipCash;
  if (!blank(ev.counted)){ const d = num(ev.counted) - expect; ctl.push(Math.abs(d) < 0.01 ? `Kassatelling klopt: ${eur(num(ev.counted))}.` : `Kassatelling: ${eur(num(ev.counted))} geteld, ${eur(expect)} verwacht. <span class="tag bad">${d < 0 ? "Tekort" : "Teveel"} ${eur(Math.abs(d))}</span>`); }
  else ctl.push(`Verwacht in de kassa: ${eur(expect)}. Vul het getelde bedrag in bij Opvallend.`);
  const rc = S.recon[ev.id];
  if (rc){ const r = rc.result; const a = Object.values(r.byUid).reduce((s,v)=>s+(v.taps||[]).length,0), b = Object.values(r.byUid).reduce((s,v)=>s+(v.tx||[]).length,0) + (r.orphan||[]).length; ctl.push(a || b ? `SumUp: ${r.matched} betalingen gekoppeld, ${a} tikken zonder betaling en ${b} betalingen zonder tik.` : `SumUp: alle ${r.matched} betalingen kloppen met de tikken.`); }
  else ctl.push("SumUp is nog niet vergeleken.");
  ctl.push(`${C.rows.filter(r => r.self).length} annulaties door de kassa, ${C.rows.filter(r => r.c && !r.self).length} correcties door management, ${C.rows.filter(r => r.e.n).length} notities.`);
  L.push(["Controle", ctl]);
  box.innerHTML = `<div class="bar"><h2>${final ? "Rapport" : "Voorlopig rapport"} · ${esc(ev.name)}${ev.date ? " · " + esc(ev.date) : ""}</h2><div class="spacer"></div><button class="btn" id="rp-dl">Downloaden</button></div>` +
    L.map(([h, items]) => items.length ? `<h3>${h}</h3><ul>${items.map(i => `<li>${i}</li>`).join("")}</ul>` : "").join("");
  const text = L.map(([h, items]) => h.toUpperCase() + "\n" + items.map(i => "• " + i.replace(/<[^>]+>/g, "")).join("\n")).join("\n\n");
  $("#rp-dl").onclick = () => saveFile(`BEPCAL rapport ${ev.name} ${ev.date||""}.txt`.replace(/[\\/:*?"<>|]/g,"-"), `BEPCAL · ${ev.name} · ${ev.date||""}${ev.location ? " · " + ev.location : ""}\n\n` + text);
}
async function saveFile(filename, data){
  try{
    const blob = new Blob([data], {type: filename.endsWith(".csv") ? "text/csv;charset=utf-8" : "text/plain;charset=utf-8"});
    const url = URL.createObjectURL(blob); const a = document.createElement("a");
    a.href = url; a.download = filename; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 4000);
  }catch{ flash("Downloaden is niet gelukt"); }
}
async function exportCsv(){
  const C = compute(S.sel); if (!C) return;
  const lines = [["tijd","medewerker","station","type","bedrag","origineel","correctie","reden","notitie"].join(";")];
  C.rows.slice().reverse().forEach(r => lines.push([new Date(r.e.t).toLocaleString("nl-BE"), who(r.uid), r.s||"door", r.e.k==="tip"?"fooi "+(r.e.m||"cash"):KIND[r.k], String(r.p).replace(".",","), KIND[r.e.k], r.c ? (r.c.action==="void"?"geannuleerd":KIND[r.c.action]) : "", (r.c&&r.c.reason)||"", r.e.n||""].map(v => '"' + String(v).replace(/"/g,'""') + '"').join(";")));
  await saveFile(`BEPCAL ${C.ev.name} ${C.ev.date||""}.csv`.replace(/[\\/:*?"<>|]/g,"-"), lines.join("\n"));
}

/* ----- celebration & sound ----- */
function unlockAudio(){ try{ if (!S.audio){ const A = window.AudioContext || window.webkitAudioContext; if (A) S.audio = new A(); } if (S.audio && S.audio.state === "suspended") S.audio.resume(); }catch{} }
function chime(soft){
  if (!S.sound || !S.audio) return;
  const ctx = S.audio, now = ctx.currentTime;
  [[880,0],[1318.5,.18]].concat(soft ? [] : [[880,.5],[1318.5,.68]]).forEach(([f, d]) => {
    const o = ctx.createOscillator(), g = ctx.createGain();
    o.type = "sine"; o.frequency.value = f;
    g.gain.setValueAtTime(0, now + d); g.gain.linearRampToValueAtTime(.35, now + d + .01); g.gain.exponentialRampToValueAtTime(.001, now + d + .45);
    o.connect(g).connect(ctx.destination); o.start(now + d); o.stop(now + d + .5);
  });
}
function celebrate(C){
  chime(false); vibrate([120,80,120,80,240]);
  const d = document.createElement("div"); d.className = "party"; d.setAttribute("role","alert");
  d.innerHTML = `<h1>BREAK-EVEN</h1><p>${hm(Date.now())} · ${eur0(C.net)} netto binnen</p><p style="opacity:.75;font-size:13px">Tik om verder te gaan</p>`;
  d.onclick = () => d.remove(); document.body.appendChild(d); setTimeout(() => d.remove(), 6000);
}

/* ----- sheet ----- */
function sheet(html, init){
  closeSheet();
  const s = document.createElement("div"); s.className = "sheet"; s.id = "sheet";
  s.innerHTML = `<div class="in" role="dialog" aria-modal="true">${html}</div>`;
  s.addEventListener("click", e => { if (e.target === s) closeSheet(); });
  document.body.appendChild(s); init && init(s);
  const f = s.querySelector("input,textarea,button"); f && f.focus();
}
function closeSheet(){ const s = $("#sheet"); if (s) s.remove(); }
document.addEventListener("keydown", e => { if (e.key === "Escape") closeSheet(); });

boot();
})();
